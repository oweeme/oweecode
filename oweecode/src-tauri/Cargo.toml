[package]
name = "oweecode"
version = "1.4.2"
description = "OweeCode — IDE de desarrollo creado por Héctor Martínez (oweeme.com)"
authors = ["Héctor Martínez <hector@oweeme.com>"]
homepage = "https://oweeme.com"
repository = "https://github.com/oweeme/oweecode"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oweecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ropey = "1.6.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
portable-pty = "0.8"
once_cell = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "postgres", "sqlite", "chrono", "rust_decimal", "json", "uuid"] }
rust_decimal = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
ssh2 = "0.9"
suppaftp = { version = "5", default-features = false }
redis = { version = "0.27", features = ["tokio-comp"] }
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
bcrypt = "0.15"
argon2 = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

